name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # kubectl ships on the runner image and embeds kustomize.
      # Fails on any directory whose kustomization does not build.
      - name: Build every kustomization
        run: |
          set -euo pipefail
          find . -name kustomization.yaml -not -path './.claude/*' -exec dirname {} \; | sort |
            while read -r dir; do
              echo "::group::$dir"
              kubectl kustomize "$dir" > /dev/null
              echo "::endgroup::"
            done
