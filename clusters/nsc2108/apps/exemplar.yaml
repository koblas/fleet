# Exemplar on nsc2108: the quickstart shape (one replica of everything,
# in-cluster Postgres, default storage class, reviews in the worker pod),
# reached through a Cloudflare Tunnel since the box has no inbound route.
# Follows exemplar's newest release: each release publishes its Kustomize
# tree, with both images pinned by digest, as the exemplar-manifests OCI
# artifact and moves `latest` onto it. Manifests and images change together,
# so every workload rolls on the next poll after a release.
#
# Secrets are not in this repo; create them in the exemplar namespace by
# hand (docs/reference/secrets-and-configmaps.md): exemplar-database,
# exemplar-root-key, exemplar-providers, exemplar-cloudflared. The setup
# page writes exemplar-github-app. Until they exist the rollout won't go
# Ready.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: exemplar
  namespace: flux-system
spec:
  interval: 2m
  url: oci://ghcr.io/koblas/exemplar-manifests
  # To hold a version instead, use tag: "0.10.0" or semver: "0.10.x".
  ref:
    tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: exemplar
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: exemplar
  path: ./base
  components:
    - ../components/postgres
  prune: true
  wait: true
  timeout: 5m
  # Mirrors exemplar's examples/k8s/quickstart. The worker's test ops stop
  # the rollout if a release moves the args the patch replaces.
  patches:
    - patch: |-
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: exemplar-settings
          namespace: exemplar
        data:
          EXEMPLAR_CONFIG_REPO: "koblas/exemplar-config-development"
          EXEMPLAR_API_URL: "https://exemplar.koblas.com"
    - target: {kind: Deployment, name: "exemplar-(api|webhook|gateway|worker|cloudflared)"}
      patch: |-
        - {op: replace, path: /spec/replicas, value: 1}
    - target: {kind: StatefulSet, name: exemplar-search}
      patch: |-
        - {op: replace, path: /spec/replicas, value: 1}
        - {op: remove, path: /spec/volumeClaimTemplates/0/spec/storageClassName}
        - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 20Gi}
        - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "2", memory: 8Gi}}}
    # args/7 is --launcher and args/8 --runner-quota; the test ops fail the
    # build if a release moves them, rather than overwrite another flag.
    - target: {kind: Deployment, name: exemplar-worker}
      patch: |-
        - {op: test, path: /spec/template/spec/containers/0/args/7, value: --launcher=kubernetes}
        - {op: test, path: /spec/template/spec/containers/0/args/8, value: --runner-quota=8}
        - {op: replace, path: /spec/template/spec/containers/0/args/7, value: --launcher=in-process}
        - {op: replace, path: /spec/template/spec/containers/0/args/8, value: --runner-quota=0}
        - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 5Gi}, limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 20Gi}}}
    - target: {kind: StatefulSet, name: exemplar-postgres}
      patch: |-
        - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 10Gi}
