# Buildkite agent-stack-k8s
# (https://buildkite.com/docs/agent/self-hosted/agent-stack-k8s), installed
# by k3s's built-in helm-controller like Radar. The controller polls
# Buildkite for jobs on its queue and runs each one as a Kubernetes Job in
# the buildkite namespace; its Role reaches nothing outside it. Upgrading is
# a version bump here.
#
# The agent token is not in this repo. Create it by hand from a Buildkite
# cluster's agent token (the org and cluster are inferred from it):
#   kubectl -n buildkite create secret generic buildkite-agent-token \
#     --from-literal=BUILDKITE_AGENT_TOKEN=<cluster agent token>
# Until it exists the controller won't start. Checkouts of private repos
# also need the SSH key Secret:
#   kubectl -n buildkite create secret generic git-ssh-credentials \
#     --from-file=SSH_PRIVATE_ED25519_KEY=<private key file>
# Flux doesn't prune either: it only deletes what it applied.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: agent-stack-k8s
  namespace: kube-system
spec:
  chart: oci://ghcr.io/buildkite/helm/agent-stack-k8s
  version: 0.53.1
  targetNamespace: buildkite
  valuesContent: |-
    agentStackSecret: buildkite-agent-token
    config:
      # Pipelines target this with `agents: {queue: kubernetes}`.
      tags:
        - queue=kubernetes
      # One node: run at most four jobs at once (the chart allows 100).
      max-in-flight: 4
      # Every job's checkout container gets the deploy key for private
      # repos, as SSH_PRIVATE_ED25519_KEY from the git-ssh-credentials
      # Secret (made by hand, like the token).
      default-checkout-params:
        envFrom:
          - secretRef:
              name: git-ssh-credentials
        # Clone from a bare mirror kept on the buildkite-git-mirrors claim
        # (git-mirrors-pvc.yaml), so a job fetches only commits the mirror
        # lacks. The chart mounts the volume into the checkout container
        # only, at /buildkite/git-mirrors.
        gitMirrors:
          volume:
            name: git-mirrors
            persistentVolumeClaim:
              claimName: buildkite-git-mirrors
          # Seconds a job waits for another job's mirror update. The first
          # fill of a mirror is a full clone over the uplink, and jobs that
          # start beside it queue on this lock.
          lockTimeout: 1800
        # --dissociate copies the objects out of the mirror instead of
        # pointing at it: the command containers do not mount the mirror,
        # and git there would fail on a checkout that borrows from it.
        cloneFlags: "-v --dissociate"
